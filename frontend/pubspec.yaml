name: personal_finance_intelligence
description: AI-powered personal finance management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3

  # Navigation
  go_router: ^14.2.0

  # Secure storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # File picker
  file_picker: ^8.0.5

  # Utils
  equatable: ^2.0.5
  uuid: ^4.4.0

  # Icons
  cupertino_icons: ^1.0.6

dependency_overrides:
  # file_picker 8.x uses compileSdk 34; flutter_plugin_android_lifecycle 2.0.35
  # bumped its minCompileSdk to 36 which breaks the check. Pin to 2.0.20 (compileSdk 34).
  flutter_plugin_android_lifecycle: 2.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#151929"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  web:
    generate: false

flutter_native_splash:
  color: "#151929"
  color_dark: "#151929"
  image: "assets/images/splash_logo.png"
  image_dark: "assets/images/splash_logo.png"
  android: true
  ios: false
  android_12:
    color: "#151929"
    image: "assets/images/splash_logo.png"
    icon_background_color: "#151929"
